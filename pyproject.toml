[project]
name = "tion-magicair"
version = "2.0.0"
description = "Интеграция Home Assistant для бризеров Tion и станций MagicAir"
requires-python = ">=3.14.2"
# Сама интеграция внешних зависимостей не имеет — клиент облака написан на
# aiohttp, который уже есть в Home Assistant.
dependencies = []

[dependency-groups]
dev = [
    # Пакет выходит вместе с ядром и пинится под его версию: 2026.11.2 — это
    # homeassistant 2026.11.2, целевое ядро тестов. Для ядер < 2026.11 в
    # climate.py остаётся legacy fallback. Преемник закрытого
    # pytest-homeassistant-custom-component.
    "pytest-homeassistant==2026.11.2",
    "pytest-timeout>=2.3",
    "pytest-cov>=6",
    # Для scripts/make_brand.py — генерации значка интеграции.
    "pillow>=11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Обязательные опции pytest-homeassistant: цикл фикстур — функция, а плагин
# respx выключен — HTTP-моки пакета работают с respx напрямую, и его плагин
# должен загрузиться после httpx-алиаса Home Assistant.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
pythonpath = ["."]
# Потолок на один тест. Зависший тест неотличим от идущего и съедает часы;
# метод thread обязателен явно — на Windows нет SIGALRM, и умолчание молча
# деградирует.
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
source = ["custom_components/tion_magicair"]

[tool.ruff]
target-version = "py313"
line-length = 88
