name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

# Новый push в ту же ветку отменяет предыдущий прогон: гонять устаревший
# коммит смысла нет.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    # Только Linux: Home Assistant импортирует fcntl, на Windows и macOS
    # тесты не запускаются в принципе.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Поставить uv
        # Плавающего тега мажора у этого экшена нет — только полные версии.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Поставить зависимости
        # --frozen: окружение собирается ровно по uv.lock, без тихого
        # обновления версий. Версия ядра в тестах должна совпадать с той,
        # на которой интеграция работает.
        run: uv sync --group dev --frozen

      - name: Прогнать тесты
        run: >-
          uv run pytest
          --cov=custom_components/tion_magicair
          --cov-report=term-missing

  hassfest:
    name: hassfest
    # Официальный валидатор Home Assistant: проверяет manifest.json,
    # strings.json и структуру интеграции.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # Обязательная проверка для попадания в каталог HACS: смотрит структуру
    # репозитория, hacs.json, манифест, наличие релиза и значка — то есть те
    # же условия, по которым бот каталога принимает заявку.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  ha-2026-11:
    name: Smoke HA 2026.11.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Установить Python 3.14
        run: uv python install 3.14

      - name: Проверить импорты интеграции на Home Assistant 2026.11.2
        run: |
          uv run --no-project --python 3.14 --with pytest-homeassistant==2026.11.2 python - <<'PY'
          from importlib import import_module

          for name in (
              "__init__", "api", "binary_sensor", "climate", "config_flow",
              "coordinator", "diagnostics", "entity", "number", "select", "sensor",
          ):
              module = "custom_components.tion_magicair"
              import_module(module if name == "__init__" else f"{module}.{name}")
              print(f"OK: {name}")
          PY
